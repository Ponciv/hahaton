<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collably - Регистрация</title>
  <link rel="stylesheet" href="style.css">
  <script>
  (function(){
    var t = localStorage.getItem('collably_theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-left">
        <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>Collably</div>
        <h2>Добро<br><span>пожаловать!</span></h2>
        <p>Создавай проекты, находи единомышленников и развивай свои идеи вместе с другими</p>
        <svg class="auth-decor" viewBox="0 0 300 200" fill="none">
          <ellipse cx="150" cy="100" rx="140" ry="60" transform="rotate(-20 150 100)" stroke="#FF4D2E" stroke-width="1.5"/>
          <path d="M150 30L165 85L220 100L165 115L150 170L135 115L80 100L135 85L150 30Z" fill="#FF4D2E"/>
        </svg>
      </div>

      <div class="auth-right">
        <h1>Регистрация</h1>
        <p class="auth-sub">Уже есть аккаунт? <a href="#">Войти →</a></p>

        <form class="auth-form" id="registerForm" novalidate>
          <div class="input-group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" name="email" id="regEmail" placeholder="Email" required autocomplete="email">
          </div>
          <div class="input-group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="password" id="regPassword" placeholder="Пароль" required minlength="6" autocomplete="new-password">
          </div>
          <div class="input-group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="confirm" id="regConfirm" placeholder="Повторите пароль" required autocomplete="new-password">
          </div>
          <p id="regError" class="field-error" style="font-size:13px;"></p>
          <button type="submit" class="btn btn-primary">Зарегистрироваться →</button>
        </form>

        <div class="divider">или</div>

        <button class="social-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.27 9.77C6.39 6.5 9.47 4.14 13.1 4.14c2.07 0 3.94.76 5.39 2l3.39-3.39C19.79 1.04 16.67 0 13.1 0 7.9 0 3.38 2.98 1.11 7.34l4.16 2.43z"/><path fill="#4285F4" d="M23.74 12.27c0-.82-.07-1.62-.21-2.39H13.1v4.53h5.99c-.26 1.39-1.04 2.57-2.21 3.36l3.41 2.64c1.99-1.84 3.45-4.55 3.45-8.14z"/><path fill="#FBBC05" d="M5.27 14.23A7.14 7.14 0 0 1 5 12c0-.79.14-1.55.39-2.26L1.23 7.31A11.96 11.96 0 0 0 0 12c0 1.66.34 3.25.95 4.7l4.32-2.47z"/><path fill="#34A853" d="M13.1 24c3.24 0 5.97-1.07 7.96-2.92l-3.41-2.64c-.94.63-2.14 1-3.55 1-2.73 0-5.04-1.84-5.87-4.32L1.91 17.6C4.17 22.09 8.31 24 13.1 24z"/></svg>
          Продолжить с Google
        </button>
        <button class="social-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          Продолжить с GitHub
        </button>

        <p class="auth-terms">Регистрируясь, вы соглашаетесь<br>с <a href="#">условиями использования</a></p>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
